name: cnpg-postgres

x-daemonless:
  title: "PostgreSQL (CloudNativePG)"
  icon: ":simple-postgresql:"
  category: "Databases"
  description: "PostgreSQL on FreeBSD, compatible with the CloudNativePG Kubernetes operator. Includes pgvector, pgaudit, and pg_failover_slots."
  upstream_url: "https://www.postgresql.org/"
  web_url: "https://cloudnative-pg.io/"
  freshports_url: "https://www.freshports.org/databases/postgresql18-server/"
  user: "bsd"
  mlock: false
  upstream_binary: false

  docs:
    volumes:
      /var/lib/postgresql/data: "Database data directory"
    ports:
      5432: "PostgreSQL port"

services:
  cnpg-postgres:
    image: ghcr.io/daemonless/cnpg-postgres:18
    container_name: cnpg-postgres
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"

    volumes:
      - /path/to/containers/postgres:/var/lib/postgresql/data

    ports:
      - "5432:5432"
